<!DOCTYPE html>
<html lang="id" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Adelia's Little World ♡ - Interactive Planner</title>
  
  <!-- Favicon disesuaikan dengan file icon-192.jpg di GitHub -->
  <link rel="icon" type="image/svg+xml" href="./icon-192.svg">
  <link rel="manifest" href="./manifest.json">
  
  <!-- Manifest & Theme Color untuk PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#294C7A">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Adelia Planner">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Quicksand:wght@500;600;700&family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Plus Jakarta Sans', 'sans-serif'],
            cute: ['Quicksand', 'sans-serif'],
            fun: ['Fredoka', 'cursive'],
          },
          colors: {
            planner: {
              blue: '#DCEEFF',
              pink: '#FCE1E8',
              lavender: '#E9E1FF',
              cream: '#FFF9F0',
              mint: '#DDF4E4',
              navy: '#294C7A',
              border: '#E7EAF2',
              catUtama: '#3B82F6',
              catAkademik: '#A855F7',
              catCare: '#EC4899',
              catHobi: '#F97316',
              catExtra: '#10B981',
            }
          },
          boxShadow: {
            'planner': '0 8px 25px rgba(41, 76, 122, 0.08)',
            'planner-hover': '0 12px 30px rgba(41, 76, 122, 0.15)',
            'soft-inner': 'inset 0 2px 6px rgba(0,0,0,0.03)'
          }
        }
      }
    }
  </script>

  <style>
    body {
      background: linear-gradient(135deg, #f8faff 0%, #f0f4ff 50%, #fff5f8 100%);
      background-attachment: fixed;
      -webkit-tap-highlight-color: transparent;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    .planner-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid #e7eaf2;
      border-radius: 20px;
    }

    .tab-content {
      display: none;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
    .tab-content.active {
      display: block;
      opacity: 1;
    }

    .custom-check input:checked ~ .checkmark {
      background-color: #294C7A;
      border-color: #294C7A;
    }
    .custom-check input:checked ~ .checkmark:after {
      display: block;
    }
    .custom-check input:disabled ~ .checkmark {
      background-color: #f1f5f9;
      border-color: #cbd5e1;
      cursor: not-allowed;
      opacity: 0.5;
    }
    .checkmark:after {
      content: "";
      position: absolute;
      display: none;
      left: 5px;
      top: 1px;
      width: 5px;
      height: 10px;
      border: solid white;
      border-width: 0 2.5px 2.5px 0;
      transform: rotate(45deg);
    }

    @media print {
      body * {
        visibility: hidden !important;
      }
      #pdfReportContainer, #pdfReportContainer * {
        visibility: visible !important;
      }
      #pdfReportContainer {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        display: block !important;
        background: white !important;
        padding: 20px !important;
      }
      .page-break {
        page-break-before: always;
      }
    }
  </style>
</head>
<body class="font-sans text-slate-700 min-h-screen flex flex-col antialiased selection:bg-sky-100 selection:text-sky-800 pb-20 md:pb-6">

  <div id="app" class="flex-grow flex flex-col max-w-6xl w-full mx-auto px-3 py-3 md:px-6 md:py-6">

    <header class="planner-card p-4 md:p-6 mb-4 md:mb-5 shadow-planner relative overflow-hidden bg-gradient-to-r from-[#DCEEFF] via-[#FCE1E8] to-[#E9E1FF]">
      <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-3 md:gap-4">
        
        <div class="flex items-center gap-3 md:gap-4">
          <div class="relative group cursor-pointer shrink-0" onclick="petMascot(event)">
            <div class="w-12 h-12 md:w-16 md:h-16 rounded-2xl bg-white/90 border-2 border-white shadow-md flex items-center justify-center text-2xl md:text-3xl transition transform active:scale-90">
              🐱
            </div>
            <span class="absolute -top-1 -right-1 bg-pink-500 text-white text-[8px] md:text-[9px] font-bold px-1.5 py-0.5 rounded-full shadow">PET ME!</span>
          </div>

          <div>
            <div class="flex items-center gap-2">
              <h1 class="text-xl md:text-3xl font-extrabold text-planner-navy font-fun tracking-wide">
                Adelia's Little World <span class="text-pink-500">♡</span>
              </h1>
            </div>
            <p class="text-[11px] md:text-sm text-planner-navy/80 font-semibold mt-0.5">
              "Little steps everyday make big results" 🐾
            </p>
          </div>
        </div>

        <div class="flex items-center justify-between md:justify-end gap-2 shrink-0 border-t border-white/40 pt-2.5 md:pt-0 md:border-0">
          <div class="bg-white/80 border border-white/90 px-3 py-1 md:py-1.5 rounded-xl shadow-sm text-left md:text-right flex-1 md:flex-none">
            <div id="headerDate" class="text-[11px] md:text-xs font-bold text-planner-navy">-- ---- ----</div>
            <div id="headerClock" class="text-[10px] md:text-[11px] text-pink-600 font-extrabold">00:00:00 WIB</div>
          </div>

          <div class="flex items-center gap-2">
            <button id="btnAlarmToggle" onclick="toggleAlarmSetting()" title="Alarm & Notifikasi Pengingat" class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-white/80 hover:bg-white text-planner-navy border border-white flex items-center justify-center transition active:scale-90 relative shadow-sm">
              <i class="fa-solid fa-bell text-xs md:text-sm" id="alarmIcon"></i>
              <span id="alarmBadge" class="absolute -top-1 -right-1 w-2.5 h-2.5 md:w-3 md:h-3 bg-emerald-500 rounded-full border-2 border-white"></span>
            </button>

            <button id="btnAmbientToggle" onclick="toggleAmbientSound()" title="Suara Lo-Fi Hujan" class="w-9 h-9 md:w-10 md:h-10 rounded-xl bg-white/80 hover:bg-white text-planner-navy border border-white flex items-center justify-center transition active:scale-90 shadow-sm">
              <i class="fa-solid fa-cloud-rain text-xs md:text-sm" id="ambientIcon"></i>
            </button>
          </div>
        </div>

      </div>
    </header>

    <div id="mainLauncherGrid" class="space-y-4 mb-4 md:mb-5">
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
        
        <div class="planner-card p-4 shadow-planner bg-gradient-to-r from-sky-50 via-purple-50 to-pink-50 border-2 border-sky-100 flex flex-col justify-between">
